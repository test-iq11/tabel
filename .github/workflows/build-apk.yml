name: بناء APK لتطبيق جدولي المدرسي

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: استخراج المشروع والتحقق وبناء APK موقّع
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: العثور على ZIP الصحيح واستخراجه
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH=""
          for candidate in \
            ./jadwali-school-updated.zip \
            ./jadwali-school-install-fix.zip \
            ./jadwali-school-fixed.zip \
            ./jadwali-school.zip \
            ./jadwali_school.zip; do
            if [ -f "$candidate" ] && unzip -Z1 "$candidate" | grep -Eq '(^|/)pubspec\.yaml$'; then
              ZIP_PATH="$candidate"
              break
            fi
          done
          if [ -z "$ZIP_PATH" ]; then
            echo "لم أعثر على ZIP مشروع معروف يحتوي على pubspec.yaml. ارفع jadwali-school-updated.zip إلى جذر المستودع."
            exit 1
          fi
          unzip -t "$ZIP_PATH"
          DEST="$RUNNER_TEMP/jadwali-school-project"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"
          PUBSPEC="$(find "$DEST" -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "لم يتم العثور على pubspec.yaml بعد استخراج الملف."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "استخدام المشروع من: $PROJECT_DIR"

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Flutter المستقر
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: عرض الإصدارات
        run: |
          flutter --version
          java -version

      - name: إعداد مفتاح توقيع ثابت (اختياري)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "لم تُضف مفاتيح توقيع ثابتة؛ سيُستخدم توقيع Debug التجريبي."
            exit 0
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ] || [ -z "${ANDROID_STORE_PASSWORD:-}" ]; then
            echo "الأسرار ANDROID_KEY_ALIAS وANDROID_KEY_PASSWORD وANDROID_STORE_PASSWORD مطلوبة مع ANDROID_KEYSTORE_BASE64"; exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: تثبيت الحزم
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: تحليل Dart
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: تشغيل الاختبارات
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test --reporter expanded

      - name: بناء APK موحد وموقّع للاختبار
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: التأكد من وجود APK وصحة التوقيع
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -qx 'AndroidManifest.xml'
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "لم يتم تحديد مسار Android SDK"; exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "لم يتم العثور على apksigner ضمن Android SDK"; exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          echo "APK_PATH=$PWD/$APK" >> "$GITHUB_ENV"

      - name: رفع APK قابل للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: jadwali-school-updated-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: نشر APK برابط مباشر ضمن GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ env.APK_PATH }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="jadwali-school-updated-apk"
          TITLE="جدولي المدرسي - النسخة المحسّنة"
          NOTES="APK موقّع للاختبار. Commit: ${COMMIT_SHA}. إذا كان التطبيق مثبتاً بمفتاح مختلف فقد يلزم إزالة النسخة القديمة بعد أخذ نسخة احتياطية من البيانات."
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --repo "$REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "$APK_PATH" --repo "$REPOSITORY" \
              --title "$TITLE" --notes "$NOTES" --prerelease --target "$COMMIT_SHA"
          fi

