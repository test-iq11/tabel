name: بناء جدولي المدرسي من ZIP

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: تحليل واختبار وبناء APK
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: التحقق من ملف المشروع المضغوط
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="jadwali-school-final.zip"
          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::ضع ملف jadwali-school-final.zip في جذر مستودع GitHub كما هو، دون فك ضغطه محلياً."
            exit 1
          fi
          unzip -t "$ZIP_FILE"

      - name: استخراج المشروع داخل بيئة البناء
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          EXTRACT_DIR="$RUNNER_TEMP/jadwali-school-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "jadwali-school-final.zip" -d "$EXTRACT_DIR"
          PUBSPEC="$(find "$EXTRACT_DIR" -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::لم أجد pubspec.yaml داخل ملف ZIP. تأكد من رفع حزمة المشروع كاملة."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "تم العثور على مشروع Flutter في: $PROJECT_DIR"

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Flutter المستقر
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: معلومات الأدوات
        shell: bash
        run: |
          flutter --version
          java -version

      - name: إعداد توقيع Release ثابت (اختياري)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "لا يوجد مفتاح Release ثابت؛ سيُستخدم مفتاح Debug للاختبار فقط. قد لا يمكن تثبيت تحديث فوق APK موقّع بمفتاح مختلف."
            exit 0
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ] || [ -z "${ANDROID_STORE_PASSWORD:-}" ]; then
            echo "::error::يلزم ضبط ANDROID_KEY_ALIAS وANDROID_KEY_PASSWORD وANDROID_STORE_PASSWORD مع ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/android/upload-keystore.jks"
          cat > "$PROJECT_DIR/android/key.properties" <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: تثبيت الحزم
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: تحليل المشروع
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter analyze

      - name: تشغيل الاختبارات
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter test --reporter expanded

      - name: بناء APK Release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x android/gradlew
          flutter build apk --release
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
            if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --verbose "$APK"; fi
          fi
          mkdir -p "$RUNNER_TEMP/jadwali-school-output"
          cp "$APK" "$RUNNER_TEMP/jadwali-school-output/app-release.apk"
          sha256sum "$RUNNER_TEMP/jadwali-school-output/app-release.apk"
          echo "APK_PATH=$RUNNER_TEMP/jadwali-school-output/app-release.apk" >> "$GITHUB_ENV"

      - name: رفع ملف APK الناتج
        uses: actions/upload-artifact@v4
        with:
          name: jadwali-school-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

