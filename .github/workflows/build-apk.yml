name: بناء تطبيق أندرويد

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: تحليل واختبار وبناء APK Release
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تحديد مجلد مشروع Flutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "pubspec.yaml" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "تم العثور على pubspec.yaml في جذر المستودع."
          elif [ -f "jadwali_school/pubspec.yaml" ]; then
            echo "PROJECT_DIR=jadwali_school" >> "$GITHUB_ENV"
            echo "تم العثور على المشروع داخل jadwali_school/."
          else
            echo "لم يتم العثور على pubspec.yaml. تأكد من رفع ملفات مشروع Flutter وليس ملف ZIP فقط."
            find . -maxdepth 3 -name pubspec.yaml -print
            exit 1
          fi

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Flutter المستقر
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: معلومات البيئة
        run: flutter --version

      - name: إعداد مفتاح توقيع ثابت (اختياري)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "لم تُضف مفاتيح توقيع ثابتة؛ سيُستخدم توقيع Debug التجريبي."
            exit 0
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ] || [ -z "${ANDROID_STORE_PASSWORD:-}" ]; then
            echo "الأسرار ANDROID_KEY_ALIAS وANDROID_KEY_PASSWORD وANDROID_STORE_PASSWORD مطلوبة مع ANDROID_KEYSTORE_BASE64"; exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF storePassword=$ANDROID_STORE_PASSWORD keyPassword=$ANDROID_KEY_PASSWORD keyAlias=$ANDROID_KEY_ALIAS storeFile=upload-keystore.jks EOF

      - name: تثبيت الحزم
        run: cd "$PROJECT_DIR" && flutter pub get

      - name: التحليل الساكن
        run: cd "$PROJECT_DIR" && flutter analyze --no-fatal-infos

      - name: الاختبارات
        run: cd "$PROJECT_DIR" && flutter test --reporter expanded

      - name: بناء APK Release
        run: cd "$PROJECT_DIR" && flutter build apk --release

      - name: التحقق من وجود ملف APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          echo "تم إنشاء الملف: $APK"
          sha256sum "$APK"

      - name: رفع APK كملف Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jadwali-school-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
