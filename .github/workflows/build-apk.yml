name: جدولي 1.31.1 - إعدادات الهاتف وتقارير المعلمين

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: تدقيق واختبار وبناء APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تحديد مشروع Flutter والتحقق من أن المشروع مرفوع بالفعل
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'JADWALI_PROJECT_DETECTOR'
          from __future__ import annotations
          
          import os
          from pathlib import Path
          import re
          import sys
          import zipfile
          
          ROOT = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          TARGET = '1.31.1'
          STAGE = ROOT / '.build_source'
          VERSION = re.compile(r'(?m)^version:\s*1\.31\.1(?:\+\d+)?\s*$')
          
          
          def valid_project(where: Path) -> bool:
              return ((where / 'pubspec.yaml').is_file()
                      and (where / 'lib' / 'main.dart').is_file()
                      and (where / 'android').is_dir())
          
          
          def matches_version(where: Path) -> bool:
              try:
                  return bool(VERSION.search((where / 'pubspec.yaml').read_text(encoding='utf-8')))
              except (OSError, UnicodeDecodeError):
                  return False
          
          
          def find_project(tree: Path) -> Path | None:
              paths = [tree]
              if tree.is_dir():
                  paths += [p.parent for p in tree.rglob('pubspec.yaml')
                            if '.git' not in p.parts and '.dart_tool' not in p.parts
                            and (len(p.relative_to(tree).parts) <= 8)]
              for folder in paths:
                  if valid_project(folder) and matches_version(folder):
                      return folder.resolve()
              return None
          
          
          def extract_zip(archive: Path, destination: Path) -> None:
              with zipfile.ZipFile(archive) as z:
                  contents = z.infolist()
                  if len(contents) > 20000 or sum(i.file_size for i in contents) > 400_000_000:
                      raise ValueError('أرشيف كبير جدًا أو غير متوقع')
                  for entry in contents:
                      entry_path = Path(entry.filename)
                      if (entry_path.is_absolute() or '..' in entry_path.parts):
                          raise ValueError('مسار غير آمن داخل ZIP')
                  destination.mkdir(parents=True, exist_ok=True)
                  z.extractall(destination)
          
          
          def try_archive(archive: Path, index: int) -> Path | None:
              destination = STAGE / f'archive_{index}'
              try:
                  print(f'فحص الأرشيف: {archive.name}', flush=True)
                  extract_zip(archive, destination)
                  direct = find_project(destination)
                  if direct:
                      return direct
                  # Supports the combined "project-and-build" ZIP containing a project ZIP.
                  inner_archives = sorted(destination.rglob('*.zip'))
                  for subindex, inner in enumerate(inner_archives[:8]):
                      if len(inner.relative_to(destination).parts) > 5:
                          continue
                      inner_dest = STAGE / f'archive_{index}_inner_{subindex}'
                      extract_zip(inner, inner_dest)
                      nested = find_project(inner_dest)
                      if nested:
                          print(f'استُخرج مشروع Flutter من ZIP داخلي: {inner.name}', flush=True)
                          return nested
              except (OSError, ValueError, zipfile.BadZipFile, zipfile.LargeZipFile) as exc:
                  print(f'لم أتمكن من استخدام {archive.name}: {exc}', flush=True)
              return None
          
          
          # Prefer the approved source-version ZIP, then the combined package, then any other ZIP.
          archives = [p for p in ROOT.glob('*.zip') if p.is_file()]
          def priority(p: Path) -> tuple[int, str]:
              n = p.name.lower()
              if n.startswith('jadwali-school-project-v1.31.1'):
                  return (0, n)
              if n.startswith('jadwali-project-and-build-v1.31.1'):
                  return (1, n)
              return (2, n)
          archives.sort(key=priority)
          project = None
          for index, archive in enumerate(archives):
              project = try_archive(archive, index)
              if project:
                  break
          
          # Fallback to a fully extracted project checked in at root or within a subfolder.
          if not project:
              for candidate in [ROOT] + [p for p in ROOT.iterdir()
                                          if p.is_dir() and p.name not in ('.git', '.github', '.build_source')]:
                  project = find_project(candidate)
                  if project:
                      break
          
          if not project:
              print('::error::ملفات المشروع غير مرفوعة أو الإصدار غير صحيح. ارفع ZIP مشروع جدولي 1.31.1 نفسه إلى جذر المستودع (Add file > Upload files > Commit changes) ثم أعد تشغيل Actions.')
              print('الملفات الموجودة في جذر الفرع:', flush=True)
              for item in sorted(ROOT.iterdir()):
                  if item.name != '.git':
                      print('  ' + item.name)
              print('يجب أن يتضمن المشروع pubspec.yaml وlib/main.dart وandroid/ وأن يكون إصداره 1.31.1.')
              sys.exit(1)
          
          relative = project.relative_to(ROOT).as_posix()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write('PROJECT_DIR=' + (relative if relative != '.' else '.') + '\n')
          print('✅ مشروع Flutter الصحيح:', relative, flush=True)
          for item in ('pubspec.yaml', 'lib/main.dart', 'android/app/build.gradle'):
              if not (project / item).is_file():
                  print('::error::ملف أساسي مفقود: ' + item)
                  sys.exit(1)
          print('✅ الإصدار مطابق:', TARGET, flush=True)
          JADWALI_PROJECT_DETECTOR

      - name: التحقق من اختيار إصدار الواجهة الحديثة 1.31.1
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^version:[[:space:]]*1[.]31[.]1([+][0-9]+)?[[:space:]]*$' "$PROJECT_DIR/pubspec.yaml" || {
            echo '::error::إصدار المشروع غير مطابق لـ 1.31.1. راجع pubspec.yaml داخل ZIP.'
            exit 1
          }
          test -f "$PROJECT_DIR/lib/features/timetable/repair_undo_dialog.dart"
          test -f "$PROJECT_DIR/test/joint_minimal_repair_127_test.dart"
          test -f "$PROJECT_DIR/lib/core/jadwali_visuals.dart"
          test -f "$PROJECT_DIR/lib/core/jadwali_palettes.dart"
          test -f "$PROJECT_DIR/lib/features/notifications/jadwali_notification_center.dart"
          test -f "$PROJECT_DIR/ci/prepare_required_fonts.py"
          test -f "$PROJECT_DIR/test/notification_center_1305_test.dart"
          test -f "$PROJECT_DIR/lib/features/setup/grade_daily_lessons_page.dart"
          test -f "$PROJECT_DIR/test/grade_daily_defaults_1294_test.dart"
          test -f "$PROJECT_DIR/test/grade_day_policy_1304_test.dart"
          test -f "$PROJECT_DIR/lib/core/html_dashboard_hero.dart"
          test -f "$PROJECT_DIR/assets/design/approved-interactive-reference.html"
          # Check the new settings button rather than the removed sidebar.
          grep -q 'top-settings' "$PROJECT_DIR/lib/app/app.dart"
          test -f "$PROJECT_DIR/test/modern_ui_128_test.dart"
          test -f "$PROJECT_DIR/test/v1310_user_requirements_test.dart"
          test -f "$PROJECT_DIR/ci/test_v1310_source.py"
          echo 'تم اختيار مصدر جدولي 1.31.1 بواجهة Flutter الحديثة.'

      - name: اختبار القيود والإتاحة على نسخة المدرسة المجهولة الأسماء
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/ci/stress_constraints_availability.py" \
            --output "$GITHUB_WORKSPACE/jadwali-stress-report.json"

      - name: رفع تقرير اختبارات القيود والإتاحة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jadwali-stress-report
          path: jadwali-stress-report.json
          if-no-files-found: ignore

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: توفير مساحة على مشغل GitHub لتنزيل وفك NDK
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          # This job builds Android only on a disposable hosted runner.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h "$GITHUB_WORKSPACE"

      - name: إعداد Flutter المستقر
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: فحص نسخة Flutter
        run: flutter --version

      - name: تثبيت NDK والتحقق من اكتماله قبل Gradle
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::لم أجد Android SDK على مشغل GitHub."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          python3 - --sdk "$SDK_ROOT" --version 28.2.13676358 --work "$RUNNER_TEMP/jadwali-ndk" <<'JADWALI_NDK'
          #!/usr/bin/env python3
          """Install and verify the requested NDK before Gradle starts (GitHub runner only)."""
          import argparse
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys


          def ndk_problem(directory, version):
              properties = directory / 'source.properties'
              if not properties.is_file():
                  return 'source.properties is missing'
              match = re.search(r'^Pkg\.Revision\s*=\s*(\S+)\s*$', properties.read_text(), re.M)
              if match is None or match.group(1) != version:
                  return 'NDK revision does not match ' + version
              clang = directory / 'toolchains/llvm/prebuilt/linux-x86_64/bin/clang'
              if not clang.is_file() or not os.access(clang, os.X_OK):
                  return 'the clang executable is missing or not executable'
              toolchain = directory / 'build/cmake/android.toolchain.cmake'
              if not toolchain.is_file() or toolchain.stat().st_size == 0:
                  return 'the Android CMake toolchain is missing'
              try:
                  subprocess.run([str(clang), '--version'], check=True, timeout=30,
                                 stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              except (OSError, subprocess.SubprocessError) as error:
                  return 'clang cannot run: ' + str(error)
              return None


          def remove_incomplete(path):
              if path.is_symlink():
                  path.unlink()
              elif path.exists():
                  shutil.rmtree(path)


          def prepare(sdk, version, work, attempts=3):
              if not re.fullmatch(r'\d+\.\d+\.\d+', version):
                  raise ValueError('Invalid NDK version')
              sdk = Path(sdk).resolve(strict=True)
              work = Path(work).resolve()
              sdkmanager = sdk / 'cmdline-tools/latest/bin/sdkmanager'
              if not sdkmanager.is_file():
                  raise FileNotFoundError('SDK manager not found: ' + str(sdkmanager))
              target = sdk / 'ndk' / version
              problem = ndk_problem(target, version)
              if problem is None:
                  print('Verified existing NDK ' + version, flush=True)
                  return
              work.mkdir(parents=True, exist_ok=True)
              for attempt in range(1, attempts + 1):
                  print(f'NDK {version}: attempt {attempt}/{attempts}; {problem}', flush=True)
                  print(f'Free SDK disk space: {shutil.disk_usage(sdk).free / (1024 ** 3):.1f} GiB', flush=True)
                  # This runs before Gradle on an isolated GitHub runner. Remove only the
                  # incomplete target and SDK manager's download staging, not other NDKs.
                  remove_incomplete(target)
                  remove_incomplete(sdk / '.temp')
                  # Each retry gets a fresh SDK manager download cache; never change HOME.
                  cache = work / f'android-user-{attempt}'
                  remove_incomplete(cache)
                  cache.mkdir(parents=True)
                  environment = dict(os.environ)
                  environment['ANDROID_USER_HOME'] = str(cache)
                  # Older command-line tools use ANDROID_PREFS_ROOT instead.
                  environment['ANDROID_PREFS_ROOT'] = str(cache)
                  try:
                      subprocess.run([str(sdkmanager), '--sdk_root=' + str(sdk),
                                      '--install', 'ndk;' + version],
                                     env=environment, check=True, timeout=900)
                  except (OSError, subprocess.SubprocessError) as error:
                      problem = 'sdkmanager failed: ' + str(error)
                  else:
                      problem = ndk_problem(target, version)
                      if problem is None:
                          print('NDK ' + version + ' installed and toolchain verified.', flush=True)
                          return
                  print('NDK verification failed: ' + str(problem), flush=True)
              remove_incomplete(target)
              raise RuntimeError(f'NDK {version} was not installed completely after {attempts} attempts: {problem}')


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--sdk', required=True)
              parser.add_argument('--version', default='28.2.13676358')
              parser.add_argument('--work', required=True)
              args = parser.parse_args()
              try:
                  prepare(args.sdk, args.version, args.work)
              except (OSError, ValueError, RuntimeError) as error:
                  print('::error::' + str(error), file=sys.stderr)
                  return 1
              return 0


          if __name__ == '__main__':
              sys.exit(main())
          JADWALI_NDK

      - name: إعداد توقيع ثابت (اختياري)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "لم تُحدد أسرار توقيع ثابت؛ سيُستخدم توقيع Debug للبناء التجريبي."
            exit 0
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ] || [ -z "${ANDROID_STORE_PASSWORD:-}" ]; then
            echo "عند تقديم ANDROID_KEYSTORE_BASE64 يجب أيضًا ضبط ANDROID_KEY_ALIAS وANDROID_KEY_PASSWORD وANDROID_STORE_PASSWORD."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: تجهيز خطوط الواجهة والتقارير على مشغل البناء
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf ] || [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-core fonts-dejavu-core
          fi
          python3 "$PROJECT_DIR/ci/prepare_required_fonts.py"
          for file in UI-Regular.ttf UI-Bold.ttf UI-Latin.ttf Arabic-Regular.ttf Report-Regular.ttf; do
            test -s "$PROJECT_DIR/assets/fonts/$file" || { echo "::error::Missing required font: $file"; exit 1; }
          done

      - name: تنزيل اعتماديات Flutter
        shell: bash
        run: cd "$PROJECT_DIR" && flutter pub get

      - name: تهيئة سجل الاختبارات
        shell: bash
        run: echo "Flutter tests not started yet" > "$GITHUB_WORKSPACE/jadwali-tests.log"

      - name: التحقق من صياغة ملفات الواجهة الجديدة
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          dart format --output=none \
            lib/app/app.dart \
            lib/main.dart \
            lib/core/html_dashboard_hero.dart \
            lib/features/dashboard/dashboard_page.dart \
            lib/core/jadwali_visuals.dart \
            lib/core/jadwali_palettes.dart \
            lib/core/theme.dart \
            lib/features/notifications/jadwali_notification_center.dart \
            lib/services/schedule_integrity_audit.dart \
            lib/services/schedule_improvement_service.dart \
            lib/services/section_time_domain_flow.dart \
            lib/services/auto_scheduler_service.dart \
            lib/services/constraint_explanation_service.dart \
            lib/services/reference_office_service.dart \
            lib/services/schedule_search_controller.dart \
            lib/features/setup/grade_daily_lessons_page.dart \
            lib/features/data_management/requirements_matrix.dart \
            lib/features/settings/app_settings_page.dart \
            lib/features/data_management/data_management_page.dart \
            lib/features/conflicts/conflicts_page.dart \
            lib/features/reports/reports_page.dart \
            lib/features/timetable/timetable_page.dart \
            test/app_navigation_test.dart \
            test/approved_html_look_test.dart \
            test/section_time_domain_flow_1308_test.dart \
            test/grade_daily_interaction_130_test.dart \
            test/grade_day_policy_1304_test.dart \
            test/dark_preview_130_test.dart \
            test/schedule_integrity_audit_130_test.dart \
            test/notification_center_1305_test.dart \
            test/v1310_user_requirements_test.dart

      - name: فحص تراجع أخطاء الواجهة والإصدار قبل تحليل Flutter
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 ci/test_enhanced_ui_source.py
          python3 ci/test_v1310_source.py
          python3 ci/test_swap_dialog_regression_1311.py
          python3 ci/test_prepare_android_ndk.py

      - name: تحليل Dart
        shell: bash
        run: cd "$PROJECT_DIR" && flutter analyze --no-fatal-infos

      - name: اختبار تنبيهات المدرسة ولوحات الألوان والوضع الليلي
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter test --reporter expanded test/notification_center_1305_test.dart \
            test/modern_ui_128_test.dart test/dark_preview_130_test.dart \
            2>&1 | tee -a "$GITHUB_WORKSPACE/jadwali-tests.log"

      - name: اختبار حفظ حصص الصف منفردًا قبل الاختبارات الأخرى
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter test --reporter expanded test/grade_daily_interaction_130_test.dart test/grade_day_policy_1304_test.dart \
            2>&1 | tee -a "$GITHUB_WORKSPACE/jadwali-tests.log"

      - name: اختبار التنقل والتقرير والبطاقة الجديدة أولاً
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter test --reporter expanded \
            test/schedule_integrity_audit_130_test.dart \
            test/grade_daily_interaction_130_test.dart \
            test/grade_day_policy_1304_test.dart \
            test/dark_preview_130_test.dart \
            test/approved_html_look_test.dart \
            test/app_navigation_test.dart \
            test/report_and_weekly_swap_test.dart \
            test/touch_swap_widget_test.dart \
            test/workload_report_colors_1307_test.dart \
            test/section_time_domain_flow_1308_test.dart \
            test/v1310_user_requirements_test.dart \
            2>&1 | tee -a "$GITHUB_WORKSPACE/jadwali-tests.log"

      - name: إعادة فحص أسباب الإخفاقات الثمانية
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter test --reporter expanded test/pdf_report_service_test.dart test/scoped_availability_page_test.dart test/scoped_availability_database_test.dart test/scoped_availability_services_test.dart test/mandatory_period_capacity_test.dart test/complete_schedule_solver_test.dart \
            2>&1 | tee -a "$GITHUB_WORKSPACE/jadwali-tests.log"

      - name: تشغيل الاختبارات
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter test --reporter expanded 2>&1 | tee -a "$GITHUB_WORKSPACE/jadwali-tests.log"

      - name: حفظ سجل الاختبارات
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jadwali-tests-log
          path: jadwali-tests.log
          if-no-files-found: ignore

      - name: بناء APK Release
        shell: bash
        run: cd "$PROJECT_DIR" && flutter build apk --release

      - name: التحقق من ملف APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          mkdir -p "$GITHUB_WORKSPACE/apk-artifact"
          cp "$APK" "$GITHUB_WORKSPACE/apk-artifact/app-release.apk"

      - name: رفع APK الناتج
        uses: actions/upload-artifact@v4
        with:
          name: jadwali-school-latest-release-apk
          path: apk-artifact/app-release.apk
          if-no-files-found: error
          retention-days: 30
