name: بناء APK لتطبيق جدولي المدرسي من ZIP

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: فحص المشروع وبناء APK
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تحديد المشروع أو استخراج ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_PATH=""
            for candidate in \
              "$GITHUB_WORKSPACE/jadwali-school-complete.zip" \
              "$GITHUB_WORKSPACE/jadwali-school-repaired.zip" \
              "$GITHUB_WORKSPACE/jadwali-school-final.zip"; do
              if [ -f "$candidate" ] && unzip -Z1 "$candidate" | grep -Eq '(^|/)pubspec\.yaml$'; then
                ZIP_PATH="$candidate"
                break
              fi
            done
            if [ -z "$ZIP_PATH" ]; then
              for candidate in "$GITHUB_WORKSPACE"/*.zip "$GITHUB_WORKSPACE"/*.ZIP; do
                [ -f "$candidate" ] || continue
                if unzip -Z1 "$candidate" | grep -Eq '(^|/)pubspec\.yaml$'; then
                  ZIP_PATH="$candidate"
                  break
                fi
              done
            fi
            if [ -z "$ZIP_PATH" ]; then
              echo "لم يُعثر على pubspec.yaml أو ZIP مشروع Flutter في جذر المستودع."
              exit 1
            fi
            unzip -t "$ZIP_PATH"
            DEST="$RUNNER_TEMP/jadwali-school-project"
            mkdir -p "$DEST"
            unzip -q "$ZIP_PATH" -d "$DEST"
            PUBSPEC="$(find "$DEST" -type f -name pubspec.yaml -print -quit)"
            if [ -z "$PUBSPEC" ]; then
              echo "لم يتم العثور على pubspec.yaml بعد استخراج ZIP."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "المشروع المستخدم: $PROJECT_DIR"

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Flutter المستقر
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: عرض الإصدارات
        run: flutter --version

      - name: تثبيت الحزم
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: تحليل Dart
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: تشغيل الاختبارات
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test --reporter expanded

      - name: بناء APK Release
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: التأكد من ملف APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"

      - name: رفع APK كملف قابل للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: jadwali-school-complete-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
